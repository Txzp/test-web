<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Aim Trainer Pro - Ultimate Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #0b0b0e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            cursor: none;
        }
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 14, 0.97);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 20px;
            text-align: center;
            padding: 20px;
            overflow-y: auto;
        }
        h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            color: #ff3366;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
        }
        .stats-panel {
            background: rgba(25, 25, 35, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 25px;
            border-radius: 12px;
            display: flex;
            gap: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .stat-item {
            text-align: center;
        }
        .stat-item span {
            display: block;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f2fe;
        }
        .stat-item label {
            font-size: 0.8rem;
            color: #888;
        }
        .config-box {
            background: rgba(20, 20, 28, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 320px;
            text-align: left;
        }
        .config-box label {
            font-size: 0.9rem;
            color: #ccc;
            display: flex;
            justify-content: space-between;
        }
        .config-box input[type="range"] {
            width: 100%;
            accent-color: #ff3366;
            cursor: pointer;
        }
        .toggle-btn {
            background: #2a2a3f;
            border: 1px solid #444;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .toggle-btn.active {
            background: #ff3366;
            border-color: #ff3366;
            box-shadow: 0 0 10px rgba(255,51,102,0.5);
        }
        .modes-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }
        .btn-mode {
            background: linear-gradient(135deg, #1f1f2e 0%, #2a2a3f 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 180px;
        }
        .btn-mode span {
            font-size: 0.75rem;
            color: #aaa;
            font-weight: normal;
        }
        .btn-mode:hover {
            transform: translateY(-2px);
            border-color: #ff3366;
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.3);
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        .stat-box {
            background: rgba(25, 25, 35, 0.85);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1rem;
            font-weight: bold;
        }
        .stat-box span {
            color: #ff3366;
        }
        #btn-exit {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 51, 102, 0.2);
            border: 1px solid #ff3366;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
            display: none;
            transition: background 0.2s;
        }
        #btn-exit:hover {
            background: #ff3366;
        }
        #feedback-text {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: 900;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0,242,254,0.6);
            pointer-events: none;
            display: none;
            z-index: 15;
            animation: fadeUp 0.6s ease forwards;
        }
        @keyframes fadeUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -100%) scale(1.2); }
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="feedback-text">HEADSHOT!</div>

    <!-- MENÚ PRINCIPAL Y ESTADÍSTICAS (Data Save corregido) -->
    <div id="menu-screen">
        <h1>ROBLOX AIM TRAINER PRO</h1>
        
        <div class="stats-panel">
            <div class="stat-item">
                <span id="stat-best">0</span>
                <label>Mejor Puntuación</label>
            </div>
            <div class="stat-item">
                <span id="stat-hits">0</span>
                <label>Aciertos Totales</label>
            </div>
            <div class="stat-item">
                <span id="stat-acc">100%</span>
                <label>Precisión Global</label>
            </div>
        </div>

        <!-- Panel de Configuración para Modo Roblox Character -->
        <div class="config-box">
            <label>Velocidad Roblox: <span id="speed-val">4</span>px</label>
            <input type="range" id="roblox-speed" min="1" max="12" value="4" oninput="updateConfigLabels()">
            
            <label>Hitbox Head Size: <span id="head-val">25</span>px</label>
            <input type="range" id="roblox-head-size" min="15" max="45" value="25" oninput="updateConfigLabels()">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
                <span style="font-size:0.9rem; color:#ccc;">Aim Assistant:</span>
                <button id="aim-assist-toggle" class="toggle-btn" onclick="toggleAimAssist()">OFF</button>
            </div>
        </div>

        <div class="modes-container">
            <button class="btn-mode" onclick="startGame('roblox')">
                Roblox Character (Izq-Der)
                <span>Head, Torso con hitbox personalizable</span>
            </button>
            <button class="btn-mode" onclick="startGame('classic')">
                Modo Clásico (30s)
                <span>Bolitas móviles con tiempo</span>
            </button>
            <button class="btn-mode" onclick="startGame('infinite')">
                Práctica Infinita
                <span>Sin límite de tiempo</span>
            </button>
            <button class="btn-mode" onclick="startGame('flick')">
                Flick Estático
                <span>Aparecen y desaparecen rápido</span>
            </button>
        </div>
    </div>

    <!-- HUD DE JUEGO -->
    <div id="ui">
        <div class="stat-box">Puntuación: <span id="score">0</span></div>
        <div class="stat-box">Precisión: <span id="accuracy">100</span>%</div>
        <div class="stat-box" id="timer-box">Tiempo: <span id="timer">30</span>s</div>
    </div>

    <button id="btn-exit" onclick="returnToMenu()">Salir al Menú</button>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameRunning = false;
        let currentMode = 'classic';
        let score = 0;
        let totalClicks = 0;
        let hits = 0;
        let timeLeft = 30;
        let timerInterval;

        let targets = [];
        let tracers = [];
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        // Configuración Modo Roblox
        let robloxConfig = {
            speed: 4,
            headRadius: 25,
            aimAssist: false
        };

        // Objeto personaje Roblox en movimiento lateral
        let robloxChar = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dir: 1
        };

        // Sistema Data Save persistente y progresivo con localStorage corregido
        let stats = JSON.parse(localStorage.getItem('roblox_aim_stats')) || { best: 0, hits: 0, totalClicks: 0 };
        updateMenuStats();

        function updateMenuStats() {
            document.getElementById('stat-best').textContent = stats.best;
            document.getElementById('stat-hits').textContent = stats.hits;
            const globalAcc = stats.totalClicks > 0 ? Math.round((stats.hits / stats.totalClicks) * 100) : 100;
            document.getElementById('stat-acc').textContent = globalAcc + '%';
        }

        function saveStatsProgressive(scoredHit, isClick) {
            if (isClick) stats.totalClicks++;
            if (scoredHit) stats.hits++;
            if (score > stats.best) stats.best = score;
            localStorage.setItem('roblox_aim_stats', JSON.stringify(stats));
            updateMenuStats();
        }

        function updateConfigLabels() {
            robloxConfig.speed = parseInt(document.getElementById('roblox-speed').value);
            robloxConfig.headRadius = parseInt(document.getElementById('roblox-head-size').value);
            document.getElementById('speed-val').textContent = robloxConfig.speed;
            document.getElementById('head-val').textContent = robloxConfig.headRadius;
        }

        function toggleAimAssist() {
            robloxConfig.aimAssist = !robloxConfig.aimAssist;
            const btn = document.getElementById('aim-assist-toggle');
            if (robloxConfig.aimAssist) {
                btn.classList.add('active');
                btn.textContent = 'ON';
            } else {
                btn.classList.remove('active');
                btn.textContent = 'OFF';
            }
        }

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mousedown', (e) => {
            if (!gameRunning) return;
            totalClicks++;

            // Rayo Taser rojo desde la parte inferior central
            tracers.push({
                startX: canvas.width / 2,
                startY: canvas.height,
                endX: e.clientX,
                endY: e.clientY,
                alpha: 1
            });

            let hitRegistered = false;

            if (currentMode === 'roblox') {
                // Coordenadas relativas de las partes del personaje Roblox
                let headX = robloxChar.x;
                let headY = robloxChar.y - 70;
                let torsoX = robloxChar.x;
                let torsoY = robloxChar.y;
                let leftArmX = robloxChar.x - 35;
                let leftArmY = robloxChar.y;
                let rightArmX = robloxChar.x + 35;
                let rightArmY = robloxChar.y;
                let leftLegX = robloxChar.x - 15;
                let leftLegY = robloxChar.y + 75;
                let rightLegX = robloxChar.x + 15;
                let rightLegY = robloxChar.y + 75;

                let clickX = e.clientX;
                let clickY = e.clientY;

                // Aim Assistant: atracción magnética si está activado
                if (robloxConfig.aimAssist) {
                    let distToHead = Math.hypot(clickX - headX, clickY - headY);
                    let distToTorso = Math.hypot(clickX - torsoX, clickY - torsoY);
                    if (distToHead < 80) { clickX = headX; clickY = headY; }
                    else if (distToTorso < 100) { clickX = torsoX; clickY = torsoY; }
                }

                // Comprobar Headshot
                let distHead = Math.hypot(clickX - headX, clickY - headY);
                if (distHead <= robloxConfig.headRadius) {
                    hits++;
                    score += 25;
                    hitRegistered = true;
                    showFeedback("¡HEADSHOT! (+25)", "#ff3366");
                } 
                // Comprobar Torso (caja de 50x70)
                else if (clickX >= torsoX - 25 && clickX <= torsoX + 25 && clickY >= torsoY - 35 && clickY <= torsoY + 35) {
                    hits++;
                    score += 10;
                    hitRegistered = true;
                    showFeedback("¡TORSO! (+10)", "#00f2fe");
                }
                // Brazos o Piernas
                else if (
                    (Math.hypot(clickX - leftArmX, clickY - leftArmY) < 20) ||
                    (Math.hypot(clickX - rightArmX, clickY - rightArmY) < 20) ||
                    (Math.hypot(clickX - leftLegX, clickY - leftLegY) < 20) ||
                    (Math.hypot(clickX - rightLegX, clickY - rightLegY) < 20)
                ) {
                    hits++;
                    score += 5;
                    hitRegistered = true;
                    showFeedback("¡EXTREMIDAD! (+5)", "#ffaa00");
                }

                saveStatsProgressive(hitRegistered, true);

            } else {
                // Modos normales de bolitas
                for (let i = targets.length - 1; i >= 0; i--) {
                    const t = targets[i];
                    const dist = Math.hypot(e.clientX - t.x, e.clientY - t.y);
                    if (dist <= t.radius) {
                        hits++;
                        score += 10;
                        hitRegistered = true;
                        targets.splice(i, 1);
                        spawnTarget();
                        break;
                    }
                }
                saveStatsProgressive(hitRegistered, true);
            }

            updateUI();
        });

        function showFeedback(text, color) {
            const fb = document.getElementById('feedback-text');
            fb.textContent = text;
            fb.style.color = color;
            fb.style.textShadow = `0 0 15px ${color}`;
            fb.style.display = 'block';
            setTimeout(() => { fb.style.display = 'none'; }, 500);
        }

        function spawnTarget() {
            if (currentMode === 'roblox') return;
            const radius = currentMode === 'flick' ? 22 : (Math.random() * 15 + 16);
            const x = Math.random() * (canvas.width - 150) + 75;
            const y = Math.random() * (canvas.height - 250) + 100;
            
            let vx = 0, vy = 0;
            if (currentMode !== 'flick') {
                const speed = Math.random() * 2.5 + 1.5;
                const angle = Math.random() * Math.PI * 2;
                vx = Math.cos(angle) * speed;
                vy = Math.sin(angle) * speed;
            }

            targets.push({
                x: x, y: y, radius: radius, vx: vx, vy: vy,
                alpha: 1, maxLife: currentMode === 'flick' ? 90 : 180, life: currentMode === 'flick' ? 90 : 180
            });
        }

        function startGame(mode) {
            currentMode = mode;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('ui').style.display = 'flex';
            document.getElementById('btn-exit').style.display = 'block';

            gameRunning = true;
            score = 0;
            totalClicks = 0;
            hits = 0;
            targets = [];
            tracers = [];

            if (mode === 'roblox') {
                robloxChar.x = canvas.width / 2;
                robloxChar.y = canvas.height / 2;
                robloxChar.dir = Math.random() > 0.5 ? 1 : -1;
                document.getElementById('timer-box').style.display = 'none';
            } else if (mode === 'classic') {
                timeLeft = 30;
                document.getElementById('timer-box').style.display = 'block';
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').textContent = timeLeft;
                    if (timeLeft <= 0) endGame();
                }, 1000);
                for (let i = 0; i < 4; i++) spawnTarget();
            } else {
                document.getElementById('timer-box').style.display = 'none';
                for (let i = 0; i < 4; i++) spawnTarget();
            }

            loop();
        }

        function endGame() {
            gameRunning = false;
            clearInterval(timerInterval);
            returnToMenu();
        }

        function returnToMenu() {
            gameRunning = false;
            clearInterval(timerInterval);
            document.getElementById('menu-screen').style.display = 'flex';
            document.getElementById('ui').style.display = 'none';
            document.getElementById('btn-exit').style.display = 'none';
            updateMenuStats();
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            const acc = totalClicks > 0 ? Math.round((hits / totalClicks) * 100) : 100;
            document.getElementById('accuracy').textContent = acc;
        }

        function loop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentMode === 'roblox') {
                // Mover personaje Roblox de izquierda a derecha
                robloxChar.x += robloxConfig.speed * robloxChar.dir;
                if (robloxChar.x > canvas.width - 100) robloxChar.dir = -1;
                if (robloxChar.x < 100) robloxChar.dir = 1;

                let rx = robloxChar.x;
                let ry = robloxChar.y;

                // Dibujar personaje estilo Roblox (Bloques estructurados)
                ctx.save();
                // Sombra general
                ctx.shadowColor = '#ff3366';
                ctx.shadowBlur = 10;

                // Cabeza (Head)
                ctx.beginPath();
                ctx.arc(rx, ry - 70, robloxConfig.headRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff3366';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Torso
                ctx.fillStyle = '#2575fc';
                ctx.fillRect(rx - 25, ry - 35, 50, 70);
                ctx.strokeRect(rx - 25, ry - 35, 50, 70);

                // Brazos
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(rx - 45, ry - 35, 18, 60);
                ctx.strokeRect(rx - 45, ry - 35, 18, 60);
                ctx.fillRect(rx + 27, ry - 35, 18, 60);
                ctx.strokeRect(rx + 27, ry - 35, 18, 60);

                // Piernas
                ctx.fillStyle = '#22bb33';
                ctx.fillRect(rx - 23, ry + 36, 20, 70);
                ctx.strokeRect(rx - 23, ry + 36, 20, 70);
                ctx.fillRect(rx + 3, ry + 36, 20, 70);
                ctx.strokeRect(rx + 3, ry + 36, 20, 70);

                ctx.restore();

            } else {
                // Renderizar y actualizar bolitas para otros modos
                for (let i = targets.length - 1; i >= 0; i--) {
                    let t = targets[i];
                    t.x += t.vx;
                    t.y += t.vy;

                    if (currentMode !== 'flick') {
                        if (t.x - t.radius < 0 || t.x + t.radius > canvas.width) t.vx *= -1;
                        if (t.y - t.radius < 70 || t.y + t.radius > canvas.height) t.vy *= -1;
                    }

                    t.life--;
                    if (t.life <= 0) {
                        targets.splice(i, 1);
                        spawnTarget();
                        continue;
                    }

                    t.alpha = t.life / t.maxLife;

                    ctx.save();
                    ctx.globalAlpha = t.alpha;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                    ctx.fillStyle = currentMode === 'flick' ? '#ff3366' : '#00f2fe';
                    ctx.shadowColor = currentMode === 'flick' ? '#ff3366' : '#00f2fe';
                    ctx.shadowBlur = 15;
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                    ctx.restore();
                }

                while (targets.length < 4) {
                    spawnTarget();
                }
            }

            // Rayo Taser rojo con desvanecimiento
            for (let i = tracers.length - 1; i >= 0; i--) {
                let tr = tracers[i];
                tr.alpha -= 0.15;

                if (tr.alpha <= 0) {
                    tracers.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = tr.alpha;
                ctx.beginPath();
                ctx.moveTo(tr.startX, tr.startY);
                ctx.lineTo(tr.endX, tr.endY);
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#ff0055';
                ctx.shadowBlur = 12;
                ctx.stroke();
                ctx.restore();
            }

            // Crosshair (Punto blanco central exacto)
            ctx.save();
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
