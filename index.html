<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>101 Días de Racha - TikTok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Bolitas de fondo animadas */
        .dot {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
            animation: floatDot 8s infinite linear;
        }

        @keyframes floatDot {
            0% {
                transform: translateY(105vh) scale(0.8);
                opacity: 0;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            margin-bottom: 10px;
            color: #ff0050;
            text-shadow: 0 0 15px rgba(255, 0, 80, 0.4);
        }

        .subtitle {
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            color: #00f2fe;
            margin-bottom: 25px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .timer-box {
            font-size: clamp(5rem, 12vw, 8rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        /* Contenedor final */
        #final-container {
            display: none;
            text-align: center;
            z-index: 10;
        }

        .final-text {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            color: #ff3366;
            text-shadow: 0 0 30px rgba(255, 51, 102, 0.8);
            animation: popIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            padding: 20px;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.2);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>
    <div id="bg-dots"></div>

    <!-- Pantalla del Temporizador -->
    <div class="container" id="main-container">
        <h1>🔥 101 Días de Racha en TikTok 🔥</h1>
        <div class="subtitle">Espera para el regalo</div>
        <div class="timer-box" id="timer">35</div>
    </div>

    <!-- Pantalla Final -->
    <div id="final-container">
        <div class="final-text">Elimina la cuenta 🙏🥀</div>
    </div>

    <script>
        // Generar bolitas de fondo aleatorias
        const bgDots = document.getElementById('bg-dots');
        for (let i = 0; i < 45; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            const size = Math.random() * 6 + 3;
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.left = Math.random() * 100 + 'vw';
            dot.style.animationDuration = (Math.random() * 5 + 6) + 's';
            dot.style.animationDelay = (Math.random() * 5) + 's';
            bgDots.appendChild(dot);
        }

        // Lógica del Temporizador de 35 segundos
        let timeLeft = 35;
        const timerEl = document.getElementById('timer');
        const mainContainer = document.getElementById('main-container');
        const finalContainer = document.getElementById('final-container');

        const countdown = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                mainContainer.style.display = 'none';
                finalContainer.style.display = 'block';
                startFireworks();
            }
        }, 1000);

        // Sistema simple de fuegos artificiales en Canvas
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];

        function startFireworks() {
            // Lanzar fuegos artificiales periódicamente
            setInterval(() => {
                createFirework(
                    Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
                    Math.random() * (canvas.height * 0.5)
                );
            }, 350);
            animateFireworks();
        }

        function createFirework(x, y) {
            const count = 60;
            const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color: color,
                    decay: Math.random() * 0.012 + 0.008
                });
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.04; // Gravedad
                p.alpha -= p.decay;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animateFireworks);
        }
    </script>
</body>
</html>
