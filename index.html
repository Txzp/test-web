<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la señora Penny</title>
    <style>
        /* ===== ESTILOS GLOBALES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', 'Helvetica', sans-serif;
            overflow: hidden;
            cursor: pointer;
            color: #ffffff;
        }

        /* ===== FONDO DE PARTÍCULAS ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== TEXTO INICIAL ===== */
        #title-initial {
            position: absolute;
            z-index: 10;
            font-size: clamp(1.5rem, 5vw, 4rem);
            font-weight: 900;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff, 0 0 40px rgba(255, 255, 255, 0.5);
            animation: pulseText 2s infinite alternate;
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
        }

        #title-initial.hidden {
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes pulseText {
            0% { text-shadow: 0 0 10px #ffffff, 0 0 20px rgba(255,255,255,0.8); transform: scale(1); }
            100% { text-shadow: 0 0 20px #ffffff, 0 0 40px #ffffff, 0 0 60px rgba(255,255,255,0.8); transform: scale(1.05); }
        }

        /* ===== CONTADOR DE CLICS ===== */
        #click-counter {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 25px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none;
            pointer-events: none;
        }

        #click-counter.visible {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        /* ===== CORAZÓN ELÉCTRICO ===== */
        #heart-container {
            position: absolute;
            z-index: 10;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #heart-container.visible {
            display: flex;
        }

        #electric-heart {
            width: 300px;
            height: 300px;
            overflow: visible;
            filter: drop-shadow(0 0 15px #ffffff) drop-shadow(0 0 30px rgba(255, 255, 255, 0.8));
            animation: electricFlicker 0.15s infinite alternate;
        }

        #heart-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke-dashoffset 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes electricFlicker {
            0% { filter: drop-shadow(0 0 15px #ffffff) drop-shadow(0 0 30px rgba(255, 255, 255, 0.6)); }
            100% { filter: drop-shadow(0 0 25px #ffffff) drop-shadow(0 0 50px #ffffff); }
        }

        /* ===== PARTÍCULAS DE EXPLOSIÓN ===== */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 15px #ffffff, 0 0 30px #ffffff;
            animation: particleFly 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes particleFly {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        /* ===== TEXTO CAYENDO FINAL ===== */
        #final-text-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            pointer-events: none;
            transition: opacity 1s ease;
        }

        #final-text-container.fade-out {
            opacity: 0;
        }

        .falling-text {
            font-size: clamp(2rem, 8vw, 6rem);
            font-weight: 900;
            text-align: center;
            text-shadow: 0 0 20px #ffffff, 0 0 40px rgba(255,255,255,0.5);
            animation: dropDown 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0;
            padding: 20px;
        }

        @keyframes dropDown {
            0% { transform: translateY(-100vh); opacity: 0; }
            60% { transform: translateY(20px); opacity: 1; }
            80% { transform: translateY(-10px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* ===== SISTEMA DE RATING ===== */
        #rating-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 300;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000000;
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: auto;
        }

        #rating-screen.visible {
            display: flex;
            opacity: 1;
        }

        .rating-title {
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        .stars-container {
            display: flex;
            gap: 15px;
        }

        .star {
            font-size: 4rem;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .star:hover, .star.active {
            color: #ffffff;
            text-shadow: 0 0 20px #ffffff, 0 0 40px #ffffff;
            transform: scale(1.1);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            #electric-heart { width: 200px; height: 200px; }
            .star { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div id="title-initial">CLICK PARA LA SORPRESA</div>

    <div id="click-counter"><span style="color:#fff;">🤍</span> <span id="click-count">0</span> / 10</div>

    <div id="heart-container">
        <svg id="electric-heart" viewBox="0 0 200 180">
            <path id="heart-path" d="M 100, 160 C 100, 160 15, 95 15, 45 C 15, 15 50, 5 75, 25 C 100, 50 100, 50 100, 50 C 100, 50 100, 50 125, 25 C 150, 5 185, 15 185, 45 C 185, 95 100, 160 100, 160 Z" />
        </svg>
    </div>

    <div id="final-text-container">
        <div class="falling-text">Para la señora<br>Penny</div>
    </div>

    <div id="rating-screen">
        <div class="rating-title">¿Qué te pareció la sorpresa?</div>
        <div class="stars-container">
            <div class="star" data-value="1">★</div>
            <div class="star" data-value="2">★</div>
            <div class="star" data-value="3">★</div>
            <div class="star" data-value="4">★</div>
            <div class="star" data-value="5">★</div>
        </div>
    </div>

    <script>
        // 1. SISTEMA DE PARTÍCULAS
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const PARTICLE_COUNT = 80;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // 2. LÓGICA PRINCIPAL Y CORAZÓN SVG
        const titleElement = document.getElementById('title-initial');
        const clickCounter = document.getElementById('click-counter');
        const clickCountSpan = document.getElementById('click-count');
        const heartContainer = document.getElementById('heart-container');
        const heartPath = document.getElementById('heart-path');
        const finalTextContainer = document.getElementById('final-text-container');
        const ratingScreen = document.getElementById('rating-screen');

        let clickCount = 0;
        const MAX_CLICKS = 10;
        let isAnimating = false;

        // Configurar la línea del SVG
        const pathLength = heartPath.getTotalLength();
        heartPath.style.strokeDasharray = pathLength;
        heartPath.style.strokeDashoffset = pathLength; // Oculto al inicio

        function createExplosion(x, y) {
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 200 + 50;
                particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
        }

        document.addEventListener('click', (e) => {
            // Prevenir clics durante animaciones o en las estrellas directamente
            if (isAnimating || clickCount >= MAX_CLICKS || e.target.classList.contains('star')) return;

            if (clickCount === 0) {
                titleElement.classList.add('hidden');
                clickCounter.classList.add('visible');
                heartContainer.classList.add('visible');
            }

            clickCount++;
            clickCountSpan.textContent = clickCount;

            // Avanzar el dibujo del corazón
            const progress = clickCount / MAX_CLICKS;
            heartPath.style.strokeDashoffset = pathLength - (pathLength * progress);

            if (clickCount >= MAX_CLICKS) {
                isAnimating = true;
                clickCounter.classList.remove('visible');

                // Romper y explotar
                setTimeout(() => {
                    const rect = heartContainer.getBoundingClientRect();
                    createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);
                    heartContainer.style.display = 'none';

                    // Mostrar texto de caída
                    setTimeout(() => {
                        finalTextContainer.style.display = 'flex';
                        
                        // Esperar 5 segundos, desvanecer texto y mostrar estrellas
                        setTimeout(() => {
                            finalTextContainer.classList.add('fade-out');
                            
                            setTimeout(() => {
                                finalTextContainer.style.display = 'none';
                                ratingScreen.classList.add('visible');
                            }, 1000); // tiempo del fade-out

                        }, 5000);

                    }, 500);

                }, 400); // Pequeña pausa antes de explotar
            }
        });

        // 3. LÓGICA DE ESTRELLAS
        const stars = document.querySelectorAll('.star');
        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                const rating = parseInt(e.target.getAttribute('data-value'));
                stars.forEach((s, index) => {
                    if (index < rating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
                // Aquí podrías enviar el rating a un servidor si lo desearas
            });
        });
    </script>
</body>
</html>
