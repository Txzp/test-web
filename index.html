<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa</title>
    <style>
        /* ===== ESTILOS GLOBALES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #000000;
            color: #ffffff;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .phase {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
            opacity: 0;
            z-index: 10;
        }
        
        /* ===== FASE 1: INICIO ===== */
        #title-angel {
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 900;
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        #title-angel span {
            color: #333333; 
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }
        .glow-letter {
            color: #c4c4c4 !important; 
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4) !important;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-style: italic;
        }
        #btn-entrar {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        #btn-entrar:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 123, 255, 0.8); }

        /* ===== FASE 2: JARDÍN 3D Y VIENTO ===== */
        #canvas-wind {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        #garden-container {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            cursor: pointer;
        }
        
        .falling-flower {
            position: absolute;
            pointer-events: none;
            animation: fallDown 4s linear forwards;
            z-index: 6;
            filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.5));
        }
        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Contenedor para separar el crecimiento del movimiento de viento y evitar bugs */
        .plant-wrapper {
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
        }
        .sway { animation: swayWind var(--speed) ease-in-out infinite alternate; }
        @keyframes swayWind {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-8deg); }
        }

        .plant {
            transform-origin: bottom center;
            transform: scaleY(0);
            opacity: 0;
            filter: drop-shadow(2px 5px 5px rgba(0,0,0,0.6));
        }
        .grow { animation: smoothGrow 1.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
        @keyframes smoothGrow {
            0% { transform: scaleY(0) scaleX(0.2); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scaleY(1) scaleX(1); opacity: 1; }
        }

        /* ===== FASE 3: PREGUNTA Y CORAZÓN ===== */
        .question-text {
            font-size: clamp(2rem, 8vw, 4rem);
            margin-bottom: 60px;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }
        .buttons-container {
            position: relative;
            width: 400px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 100px;
        }
        .btn-answer {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 45px;
            font-size: 1.5rem;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        #btn-yes {
            position: absolute; left: 20px;
            transition: background 0.2s, box-shadow 0.2s;
        }
        #btn-yes:hover { background: #e0e0e0; box-shadow: 0 0 25px rgba(255,255,255,0.5); }
        
        /* Botón No asegurado para que NUNCA crezca */
        #btn-no {
            position: absolute; right: 20px;
            transform: scale(1) !important;
            transition: none !important;
        }
        #btn-no:hover, #btn-no:active {
            transform: scale(1) !important;
            background: #ffffff !important;
        }

        #final-heart {
            position: absolute;
            width: 80px;
            height: 80px;
            display: none;
            z-index: 100;
            filter: drop-shadow(0 0 15px #ff3366);
        }
        .heart-shatter-anim {
            display: block !important;
            animation: heartSequence 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes heartSequence {
            0% { transform: scale(0); opacity: 0; }
            20% { transform: scale(1); opacity: 1; }
            40% { transform: scale(1.2); }
            60% { transform: scale(0.3); }
            90% { transform: scale(3.5); filter: brightness(1.5); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }

        .heart-piece {
            position: absolute;
            width: 15px; height: 15px;
            background: #ff3366;
            border-radius: 50%;
            pointer-events: none;
            z-index: 101;
            box-shadow: 0 0 10px #ff3366;
            animation: flyPiece 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes flyPiece {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#145214" />
                <stop offset="50%" stop-color="#32cd32" />
                <stop offset="100%" stop-color="#145214" />
            </linearGradient>
            <radialGradient id="sunflowerCenter" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#5c3a21" />
                <stop offset="80%" stop-color="#3e2311" />
                <stop offset="100%" stop-color="#1a0e06" />
            </radialGradient>
            <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffea00" />
                <stop offset="100%" stop-color="#ccaa00" />
            </linearGradient>
            <radialGradient id="flowerGradPink" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#ff69b4" />
            </radialGradient>
        </defs>
    </svg>

    <div id="phase1" class="phase" style="display: flex; opacity: 1;">
        <h1 id="title-angel">
            <span>A</span><span>n</span><span>g</span><span>e</span><span>l</span>
        </h1>
        <p class="subtitle">hecho con amor</p>
        <button id="btn-entrar">Entrar!</button>
    </div>

    <div id="phase2" class="phase" style="display: none;">
        <canvas id="canvas-wind"></canvas>
        <div id="garden-container">
            
            <div class="plant-wrapper" style="left: 4%; --speed: 2.8s;">
                <svg class="plant" style="width: 70px; height: 90px;" viewBox="0 0 50 100">
                    <path d="M25,100 Q10,50 5,20 M25,100 Q20,60 15,30 M25,100 Q30,50 45,20" stroke="url(#stemGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="plant-wrapper" style="left: 92%; --speed: 3.2s;">
                <svg class="plant" style="width: 60px; height: 80px;" viewBox="0 0 50 100">
                    <path d="M25,100 Q15,40 10,10 M25,100 Q25,50 30,20 M25,100 Q40,60 45,30" stroke="url(#stemGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
                </svg>
            </div>

            <div class="plant-wrapper" style="left: 10%; --speed: 4s;">
                <svg class="plant" style="width: 130px; height: 260px;" viewBox="0 0 100 250">
                    <path d="M50,250 Q45,150 50,50" stroke="url(#stemGrad)" stroke-width="8" fill="none"/>
                    <path d="M46,160 Q15,150 20,120 Q40,140 46,160" fill="url(#stemGrad)"/>
                    <g transform="translate(50, 50)">
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(0)" />
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(30)" />
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(60)" />
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(90)" />
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(120)" />
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(150)" />
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(180)" />
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(210)" />
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(240)" />
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(270)" />
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(300)" />
                        <ellipse cx="0" cy="-28" rx="10" ry="28" fill="url(#petalGrad)" transform="rotate(330)" />
                        <circle cx="0" cy="0" r="22" fill="url(#sunflowerCenter)" />
                    </g>
                </svg>
            </div>
            
            <div class="plant-wrapper" style="left: 30%; --speed: 3.6s;">
                <svg class="plant" style="width: 115px; height: 240px;" viewBox="0 0 100 250">
                    <path d="M50,250 Q55,150 50,50" stroke="url(#stemGrad)" stroke-width="7" fill="none"/>
                    <path d="M54,120 Q85,110 80,90 Q65,100 54,120" fill="url(#stemGrad)"/>
                    <g transform="translate(50, 50)">
                        <ellipse cx="0" cy="-24" rx="9" ry="24" fill="url(#petalGrad)" transform="rotate(0)" />
                        <ellipse cx="0" cy="-24" rx="9" ry="24" fill="url(#petalGrad)" transform="rotate(40)" />
                        <ellipse cx="0" cy="-24" rx="9" ry="24" fill="url(#petalGrad)" transform="rotate(80)" />
                        <ellipse cx="0" cy="-24" rx="9" ry="24" fill="url(#petalGrad)" transform="rotate(120)" />
                        <ellipse cx="0" cy="-24" rx="9" ry="24" fill="url(#petalGrad)" transform="rotate(160)" />
                        <ellipse cx="0" cy="-24" rx="9" ry="24" fill="url(#petalGrad)" transform="rotate(200)" />
                        <ellipse cx="0" cy="-24" rx="9" ry="24" fill="url(#petalGrad)" transform="rotate(240)" />
                        <ellipse cx="0" cy="-24" rx="9" ry="24" fill="url(#petalGrad)" transform="rotate(280)" />
                        <ellipse cx="0" cy="-24" rx="9" ry="24" fill="url(#petalGrad)" transform="rotate(320)" />
                        <circle cx="0" cy="0" r="18" fill="url(#sunflowerCenter)" />
                    </g>
                </svg>
            </div>

            <div class="plant-wrapper" style="left: 75%; --speed: 3.5s;">
                <svg class="plant" style="width: 120px; height: 250px;" viewBox="0 0 100 250">
                    <path d="M50,250 Q55,150 50,50" stroke="url(#stemGrad)" stroke-width="7" fill="none"/>
                    <path d="M47,150 Q10,140 15,110 Q35,130 47,150" fill="url(#stemGrad)"/>
                    <g transform="translate(50, 50)">
                        <ellipse cx="0" cy="-25" rx="9" ry="25" fill="url(#petalGrad)" transform="rotate(0)" />
                        <ellipse cx="0" cy="-25" rx="9" ry="25" fill="url(#petalGrad)" transform="rotate(45)" />
                        <ellipse cx="0" cy="-25" rx="9" ry="25" fill="url(#petalGrad)" transform="rotate(90)" />
                        <ellipse cx="0" cy="-25" rx="9" ry="25" fill="url(#petalGrad)" transform="rotate(135)" />
                        <ellipse cx="0" cy="-25" rx="9" ry="25" fill="url(#petalGrad)" transform="rotate(180)" />
                        <ellipse cx="0" cy="-25" rx="9" ry="25" fill="url(#petalGrad)" transform="rotate(225)" />
                        <ellipse cx="0" cy="-25" rx="9" ry="25" fill="url(#petalGrad)" transform="rotate(270)" />
                        <ellipse cx="0" cy="-25" rx="9" ry="25" fill="url(#petalGrad)" transform="rotate(315)" />
                        <circle cx="0" cy="0" r="19" fill="url(#sunflowerCenter)" />
                    </g>
                </svg>
            </div>

            <div class="plant-wrapper" style="left: 48%; --speed: 4.5s;">
                <svg class="plant" style="width: 85px; height: 200px;" viewBox="0 0 100 200">
                    <path d="M50,200 Q40,120 50,40" stroke="url(#stemGrad)" stroke-width="5" fill="none"/>
                    <g transform="translate(50, 40)">
                        <circle cx="-15" cy="-15" r="18" fill="url(#flowerGradPink)"/>
                        <circle cx="15" cy="-15" r="18" fill="url(#flowerGradPink)"/>
                        <circle cx="-15" cy="10" r="18" fill="url(#flowerGradPink)"/>
                        <circle cx="15" cy="10" r="18" fill="url(#flowerGradPink)"/>
                        <circle cx="0" cy="-2" r="10" fill="url(#sunflowerCenter)"/>
                    </g>
                </svg>
            </div>

            <div class="plant-wrapper" style="left: 62%; --speed: 3.8s;">
                <svg class="plant" style="width: 75px; height: 170px;" viewBox="0 0 100 200">
                    <path d="M50,200 Q60,120 50,40" stroke="url(#stemGrad)" stroke-width="4" fill="none"/>
                    <g transform="translate(50, 40)">
                        <circle cx="-12" cy="-12" r="14" fill="#ffcccb"/>
                        <circle cx="12" cy="-12" r="14" fill="#ffcccb"/>
                        <circle cx="0" cy="8" r="14" fill="#ffcccb"/>
                        <circle cx="0" cy="-2" r="8" fill="url(#petalGrad)"/>
                    </g>
                </svg>
            </div>
            
            <div class="plant-wrapper" style="left: 20%; --speed: 4.2s;">
                <svg class="plant" style="width: 75px; height: 170px;" viewBox="0 0 100 200">
                    <path d="M50,200 Q40,120 50,40" stroke="url(#stemGrad)" stroke-width="5" fill="none"/>
                    <g transform="translate(50, 40)">
                        <circle cx="0" cy="-20" r="15" fill="#87cefa"/>
                        <circle cx="-18" cy="-5" r="15" fill="#87cefa"/>
                        <circle cx="18" cy="-5" r="15" fill="#87cefa"/>
                        <circle cx="-10" cy="15" r="15" fill="#87cefa"/>
                        <circle cx="10" cy="15" r="15" fill="#87cefa"/>
                        <circle cx="0" cy="0" r="10" fill="#ffffff"/>
                    </g>
                </svg>
            </div>
            
            <div class="plant-wrapper" style="left: 40%; --speed: 2.5s;">
                <svg class="plant" style="width: 50px; height: 70px;" viewBox="0 0 50 100">
                    <path d="M25,100 Q15,40 10,10 M25,100 Q25,50 30,20" stroke="url(#stemGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="plant-wrapper" style="left: 88%; --speed: 3s;">
                <svg class="plant" style="width: 70px; height: 60px;" viewBox="0 0 50 100">
                    <path d="M25,100 Q10,50 5,20 M25,100 Q35,60 40,35" stroke="url(#stemGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </div>

    <div id="phase3" class="phase" style="display: none;">
        <div class="question-text">¿Te gustó? 🥺</div>
        <div class="buttons-container" id="btns-container">
            <button id="btn-yes" class="btn-answer">Sí</button>
            <button id="btn-no" class="btn-answer">No</button>
        </div>
        
        <svg id="final-heart" viewBox="0 0 200 200">
            <path d="M100 180 C 100 180, 10 110, 10 50 C 10 20, 45 10, 70 30 C 100 55, 100 55, 100 55 C 100 55, 100 55, 130 30 C 155 10, 190 20, 190 50 C 190 110, 100 180, 100 180 Z" fill="#ff3366"/>
        </svg>
    </div>

    <script>
        function cambiarFase(faseOcultar, faseMostrar, callback) {
            faseOcultar.style.opacity = 0; 
            setTimeout(() => {
                faseOcultar.style.display = 'none'; 
                faseMostrar.style.display = 'flex'; 
                void faseMostrar.offsetWidth; 
                faseMostrar.style.opacity = 1; 
                if(callback) callback(); 
            }, 800); 
        }

        const phase1 = document.getElementById('phase1');
        const phase2 = document.getElementById('phase2');
        const phase3 = document.getElementById('phase3');
        
        // FASE 1
        const btnEntrar = document.getElementById('btn-entrar');
        const letters = document.querySelectorAll('#title-angel span');

        btnEntrar.addEventListener('click', () => {
            btnEntrar.style.pointerEvents = 'none'; 
            
            letters.forEach((letter, index) => {
                setTimeout(() => {
                    letter.classList.add('glow-letter');
                }, index * 300); 
            });

            setTimeout(() => {
                cambiarFase(phase1, phase2, iniciarFase2);
            }, letters.length * 300 + 800);
        });

        // FASE 2
        let isPhase2Active = false;
        
        function iniciarFase2() {
            isPhase2Active = true;
            
            const plants = document.querySelectorAll('.plant');
            const wrappers = document.querySelectorAll('.plant-wrapper');

            plants.forEach(plant => {
                plant.classList.add('grow');
            });

            setTimeout(() => {
                wrappers.forEach(wrapper => {
                    wrapper.classList.add('sway');
                });
            }, 1800);
            
            initWind();
            loopWind();

            setTimeout(() => {
                isPhase2Active = false;
                cambiarFase(phase2, phase3, iniciarFase3);
            }, 15000); 
        }

        const garden = document.getElementById('garden-container');
        garden.addEventListener('click', (e) => {
            if(!isPhase2Active) return;
            crearFlorCayendo(e.clientX, e.clientY);
        });

        function crearFlorCayendo(x, y) {
            const flower = document.createElement('div');
            flower.className = 'falling-flower';
            flower.style.left = (x - 25) + 'px'; 
            flower.style.top = (y - 25) + 'px';
            
            flower.innerHTML = `
                <svg width="50" height="50" viewBox="0 0 100 100">
                    <circle cx="50" cy="20" r="15" fill="url(#flowerGradPink)"/>
                    <circle cx="20" cy="50" r="15" fill="url(#flowerGradPink)"/>
                    <circle cx="80" cy="50" r="15" fill="url(#flowerGradPink)"/>
                    <circle cx="50" cy="80" r="15" fill="url(#flowerGradPink)"/>
                    <circle cx="50" cy="50" r="12" fill="#ffd700"/>
                </svg>
            `;
            document.body.appendChild(flower);
            setTimeout(() => { flower.remove(); }, 4000);
        }

        // VIENTO GRIS
        const canvas = document.getElementById('canvas-wind');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        let windParticles = [];
        function initWind() {
            for(let i = 0; i < 40; i++) {
                windParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speedX: -(Math.random() * 2 + 1), 
                    speedY: Math.random() * 0.5 - 0.25, 
                    size: Math.random() * 1.5 + 0.5,
                    opacity: Math.random() * 0.4 + 0.1 
                });
            }
        }

        function loopWind() {
            if (!isPhase2Active) {
                ctx.clearRect(0, 0, canvas.width, canvas.height); 
                return;
            }
            requestAnimationFrame(loopWind);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            windParticles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if(p.x < 0) {
                    p.x = canvas.width;
                    p.y = Math.random() * canvas.height;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(180, 180, 180, ${p.opacity})`; 
                ctx.fill();
            });
        }

        // FASE 3
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const btnsContainer = document.getElementById('btns-container');
        const questionText = document.querySelector('.question-text');
        const finalHeart = document.getElementById('final-heart');

        function iniciarFase3() {}

        function moverBotonNo() {
            const maxX = window.innerWidth - btnNo.offsetWidth - 20;
            const maxY = window.innerHeight - btnNo.offsetHeight - 20;
            const randomX = Math.max(20, Math.random() * maxX);
            const randomY = Math.max(20, Math.random() * maxY);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        btnNo.addEventListener('mouseover', moverBotonNo);
        btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); moverBotonNo(); });

        btnYes.addEventListener('click', () => {
            questionText.style.display = 'none';
            btnsContainer.style.display = 'none';
            
            finalHeart.style.left = 'calc(50% - 40px)';
            finalHeart.style.top = 'calc(50% - 40px)';
            
            finalHeart.classList.add('heart-shatter-anim');
            
            setTimeout(() => {
                explotarCorazon();
                setTimeout(() => { window.location.reload(); }, 1500);
            }, 1900);
        });

        function explotarCorazon() {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            
            for (let i = 0; i < 40; i++) {
                const piece = document.createElement('div');
                piece.className = 'heart-piece';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 300 + 50;
                
                piece.style.left = cx + 'px';
                piece.style.top = cy + 'px';
                piece.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                piece.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                
                document.body.appendChild(piece);
            }
        }
    </script>
</body>
</html>
