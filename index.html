<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️Penny</title>
    <style>
        /* ===== ESTILOS GLOBALES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', 'Helvetica', sans-serif;
            overflow: hidden;
            cursor: pointer;
        }

        /* ===== FONDO DE PARTÍCULAS ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        #container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            pointer-events: none;
        }

        #container > * {
            pointer-events: auto;
        }

        /* ===== TEXTO 3D INICIAL ===== */
        #title-3d {
            font-size: clamp(2rem, 6vw, 5rem);
            font-weight: 900;
            color: #ff0055;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) perspective(500px) rotateX(8deg) rotateY(-5deg);
            white-space: nowrap;
            padding: 20px;
            background: linear-gradient(180deg, #ff0055 0%, #ff4488 50%, #ff0055 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 25px rgba(255, 0, 85, 0.6));
            animation: neonPulse 1.5s ease-in-out infinite alternate;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        #title-3d.hidden {
            opacity: 0;
            transform: translate(-50%, -50%) perspective(500px) rotateX(8deg) rotateY(-5deg) scale(0.5);
            pointer-events: none;
        }

        @keyframes neonPulse {
            0% {
                text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055;
                transform: translate(-50%, -50%) perspective(500px) rotateX(8deg) rotateY(-5deg) scale(1);
            }
            100% {
                text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055, 0 0 80px #ff0055, 0 0 120px #ff0055;
                transform: translate(-50%, -50%) perspective(500px) rotateX(8deg) rotateY(-5deg) scale(1.05);
            }
        }

        /* ===== INDICADOR DE CLICS ===== */
        #click-counter {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 28px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        #click-counter.visible {
            display: block;
            animation: fadeInUp 0.6s ease;
        }

        #click-counter span {
            color: #ff0055;
            font-weight: bold;
            font-size: 1.6rem;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ===== CONTENEDOR DEL CORAZÓN 3D ===== */
        #heart-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #heart-container.visible {
            display: flex;
        }

        /* ===== CORAZÓN 3D PROGRESIVO ===== */
        .heart-3d {
            position: relative;
            width: 200px;
            height: 200px;
            transform-style: preserve-3d;
            transform: rotateX(-10deg) rotateY(0deg) scale(0);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Animación de rotura */
        .heart-3d.breaking {
            animation: explodeHeart 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes explodeHeart {
            0% { transform: rotateX(-10deg) rotateY(0deg) scale(var(--current-scale, 1)); opacity: 1; }
            40% { transform: rotateX(20deg) rotateY(180deg) scale(1.3); opacity: 0.9; }
            100% { transform: rotateX(45deg) rotateY(360deg) scale(0); opacity: 0; }
        }

        /* ===== CARAS DEL CORAZÓN 3D ===== */
        .heart-face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 30% 30%, #ff3366, #cc0044);
            border-radius: 50% 50% 0 0;
            transform-origin: center;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5), inset 0 -20px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .heart-face.front { transform: translateZ(25px); }
        .heart-face.back { transform: rotateY(180deg) translateZ(25px); background: radial-gradient(circle at 70% 30%, #ff4477, #aa0033); }
        .heart-face.left { transform: rotateY(-90deg) translateZ(25px); border-radius: 50% 0 0 50%; }
        .heart-face.right { transform: rotateY(90deg) translateZ(25px); border-radius: 0 50% 50% 0; }
        .heart-face.top { transform: rotateX(90deg) translateZ(25px); border-radius: 50% 50% 0 0; }
        .heart-face.bottom { transform: rotateX(-90deg) translateZ(25px); border-radius: 0 0 50% 50%; }

        /* ===== PARTÍCULAS DE EXPLOSIÓN ===== */
        .particle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ff0055, #ff4488);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
            animation: particleFly 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes particleFly {
            0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0) rotate(540deg); }
        }

        /* ===== REVELACIÓN DE LA LETRA "L" ===== */
        #letter-reveal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            pointer-events: auto;
        }

        #letter-reveal.visible {
            display: flex;
            animation: fadeInReveal 1.2s ease;
        }

        @keyframes fadeInReveal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #letter-reveal .letter {
            font-size: clamp(12rem, 40vw, 30rem);
            font-weight: 900;
            color: #ff0055;
            text-shadow: 0 0 40px #ff0055, 0 0 80px #ff0055, 0 0 160px #ff0055, 0 0 300px #ff0055;
            animation: letterAppear 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, letterPulse 2s ease-in-out 1.2s infinite alternate;
        }

        @keyframes letterAppear {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes letterPulse {
            0% { transform: scale(1); text-shadow: 0 0 40px #ff0055, 0 0 80px #ff0055; }
            100% { transform: scale(1.06); text-shadow: 0 0 60px #ff0055, 0 0 120px #ff0055, 0 0 240px #ff0055; }
        }

        /* ===== BOTÓN PARA REINICIAR ===== */
        #reset-btn {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            padding: 14px 35px;
            background: rgba(255, 0, 85, 0.2);
            border: 2px solid rgba(255, 0, 85, 0.5);
            color: #ff0055;
            font-size: 0.95rem;
            font-family: 'Arial Black', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: none;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #reset-btn:hover {
            background: rgba(255, 0, 85, 0.4);
            border-color: #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
            transform: translateX(-50%) scale(1.05);
        }

        #reset-btn.visible {
            display: block;
            animation: fadeInUp 0.8s ease;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .heart-3d, .heart-face { width: 150px; height: 150px; }
            #click-counter { bottom: 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div id="title-3d">CLICK PARA LA SORPRESA</div>

    <div id="click-counter">❤️ <span id="click-count">0</span> / 10</div>

    <div id="heart-container">
        <div class="heart-3d" id="heart-3d">
            <div class="heart-face front"></div>
            <div class="heart-face back"></div>
            <div class="heart-face left"></div>
            <div class="heart-face right"></div>
            <div class="heart-face top"></div>
            <div class="heart-face bottom"></div>
        </div>
    </div>

    <div id="letter-reveal">
        <div class="letter">L</div>
    </div>

    <button id="reset-btn">🔄 Reiniciar magia</button>

    <script>
        // ============================================
        // 1. SISTEMA DE PARTÍCULAS DE FONDO
        // ============================================
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const PARTICLE_COUNT = 100;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ============================================
        // 2. LÓGICA PRINCIPAL Y PROGRESO DE CLICS
        // ============================================
        const titleElement = document.getElementById('title-3d');
        const heartContainer = document.getElementById('heart-container');
        const heart3D = document.getElementById('heart-3d');
        const clickCounter = document.getElementById('click-counter');
        const clickCountSpan = document.getElementById('click-count');
        const letterReveal = document.getElementById('letter-reveal');
        const resetBtn = document.getElementById('reset-btn');

        let clickCount = 0;
        const MAX_CLICKS = 10;
        let isAnimating = false;
        let isComplete = false;

        function createExplosionParticles(x, y, count = 25) {
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 220 + 50;
                particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1200);
            }
        }

        function handleClick(e) {
            if (isAnimating || isComplete) return;

            if (clickCount === 0) {
                titleElement.classList.add('hidden');
                clickCounter.classList.add('visible');
                heartContainer.classList.add('visible');
            }

            clickCount++;
            clickCountSpan.textContent = clickCount;

            // Calcular escala progresiva (crece un 10% por cada clic hasta llegar a 1 en el clic 10)
            let currentScale = clickCount / MAX_CLICKS;
            heart3D.style.transform = `scale(${currentScale}) rotateX(-10deg) rotateY(${clickCount * 15}deg)`;
            heart3D.style.setProperty('--current-scale', currentScale);

            // Coordenadas para partículas en cada clic
            const rect = heartContainer.getBoundingClientRect();
            createExplosionParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 12);

            if (clickCount >= MAX_CLICKS) {
                isComplete = true;
                isAnimating = true;
                clickCounter.classList.remove('visible');

                // Romper corazón y estallar
                heart3D.classList.add('breaking');
                createExplosionParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 60);

                setTimeout(() => {
                    letterReveal.classList.add('visible');
                    resetBtn.classList.add('visible');
                    isAnimating = false;
                }, 1500);
            }
        }

        function resetAll() {
            clickCount = 0;
            isAnimating = false;
            isComplete = false;

            letterReveal.classList.remove('visible');
            resetBtn.classList.remove('visible');
            clickCounter.classList.remove('visible');
            heartContainer.classList.remove('visible');

            heart3D.classList.remove('breaking');
            heart3D.style.transform = 'scale(0) rotateX(-10deg) rotateY(0deg)';
            
            titleElement.classList.remove('hidden');
            clickCountSpan.textContent = '0';
            document.querySelectorAll('.particle').forEach(p => p.remove());
        }

        document.addEventListener('click', handleClick);
        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetAll();
        });
        resetBtn.addEventListener('mousedown', (e) => e.stopPropagation());
    </script>
</body>
</html>
