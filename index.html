<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa</title>
    <style>
        /* ===== ESTILOS GLOBALES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #000000;
            color: #ffffff;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ===== FASES (CONTENEDORES) ===== */
        .phase {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
            opacity: 0;
            z-index: 10;
        }
        /* Para asegurar que no se crucen, las ocultaremos completamente con JS */
        
        /* ===== FASE 1: INICIO ===== */
        #title-angel {
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 900;
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        #title-angel span {
            color: #4a4a4a; /* Gris oscuro */
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }
        .subtitle {
            color: #888;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-style: italic;
        }
        #btn-entrar {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        #btn-entrar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 123, 255, 0.8);
        }

        /* ===== FASE 2: EL JARDÍN Y FUEGOS ARTIFICIALES ===== */
        #canvas-fireworks {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        #garden-container {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none; /* Todo es automático ahora */
        }

        /* Flores y Plantas SVG */
        .plant {
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            transform: scale(0);
        }
        /* Animación de crecimiento */
        .grow { animation: growUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes growUp {
            0% { transform: scale(0) translateY(50px); }
            100% { transform: scale(1) translateY(0); }
        }
        /* Animación de viento */
        .sway { animation: swayWind var(--speed) ease-in-out infinite alternate; }
        @keyframes swayWind {
            0% { transform: scale(1) rotate(-8deg); }
            100% { transform: scale(1) rotate(8deg); }
        }

        /* ===== FASE 3: LA PREGUNTA ===== */
        .question-text {
            font-size: clamp(2rem, 8vw, 4rem);
            margin-bottom: 50px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        .buttons-container {
            position: relative;
            width: 300px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .btn-answer {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }
        #btn-yes:hover {
            background: #e0e0e0;
            box-shadow: 0 0 25px rgba(255,255,255,0.6);
        }
        #btn-no {
            position: absolute;
            transition: all 0.2s ease;
        }

        /* ===== EXPLOSIÓN DEL CORAZÓN (FINAL) ===== */
        #final-heart {
            position: absolute;
            width: 50px;
            height: 50px;
            fill: #ff3366;
            display: none;
            z-index: 100;
            filter: drop-shadow(0 0 20px #ff3366);
        }
        .explode-heart {
            display: block !important;
            animation: heartExplode 1.5s cubic-bezier(0.5, 0, 0.5, 1) forwards;
        }
        @keyframes heartExplode {
            0% { transform: scale(1); opacity: 1; }
            70% { transform: scale(50); opacity: 1; }
            100% { transform: scale(60); opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="phase1" class="phase" style="display: flex; opacity: 1;">
        <h1 id="title-angel">
            <span>A</span><span>n</span><span>g</span><span>e</span><span>l</span>
        </h1>
        <p class="subtitle">hecho con amor</p>
        <button id="btn-entrar">Entrar!</button>
    </div>

    <div id="phase2" class="phase" style="display: none;">
        <canvas id="canvas-fireworks"></canvas>
        <div id="garden-container">
            <svg class="plant" style="left: 10%; width: 60px; height: 80px; --speed: 3s; animation-delay: 0.1s;" viewBox="0 0 50 100">
                <path d="M25,100 Q10,50 5,20 M25,100 Q20,60 15,30 M25,100 Q30,50 45,20 M25,100 Q35,60 40,35" stroke="#2e8b57" stroke-width="4" fill="none" stroke-linecap="round"/>
            </svg>
            <svg class="plant" style="left: 35%; width: 50px; height: 70px; --speed: 2.5s; animation-delay: 0.3s;" viewBox="0 0 50 100">
                <path d="M25,100 Q15,40 10,10 M25,100 Q25,50 30,20 M25,100 Q40,60 45,30" stroke="#228b22" stroke-width="4" fill="none" stroke-linecap="round"/>
            </svg>
            <svg class="plant" style="left: 65%; width: 70px; height: 90px; --speed: 3.2s; animation-delay: 0.2s;" viewBox="0 0 50 100">
                <path d="M25,100 Q10,50 5,20 M25,100 Q20,60 15,30 M25,100 Q30,50 45,20 M25,100 Q35,60 40,35" stroke="#2e8b57" stroke-width="4" fill="none" stroke-linecap="round"/>
            </svg>
            <svg class="plant" style="left: 85%; width: 60px; height: 75px; --speed: 2.8s; animation-delay: 0.4s;" viewBox="0 0 50 100">
                <path d="M25,100 Q15,40 10,10 M25,100 Q25,50 30,20 M25,100 Q40,60 45,30" stroke="#32cd32" stroke-width="4" fill="none" stroke-linecap="round"/>
            </svg>

            <svg class="plant" style="left: 20%; width: 120px; height: 250px; --speed: 4s; animation-delay: 0.5s;" viewBox="0 0 100 250">
                <path d="M50,250 Q45,150 50,50" stroke="#228b22" stroke-width="6" fill="none"/>
                <path d="M48,160 Q20,150 25,130 Q40,140 48,160" fill="#228b22"/>
                <path d="M51,120 Q80,110 75,90 Q60,100 51,120" fill="#228b22"/>
                <g transform="translate(50, 50)">
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(0)" />
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(30)" />
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(60)" />
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(90)" />
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(120)" />
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(150)" />
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(180)" />
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(210)" />
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(240)" />
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(270)" />
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(300)" />
                    <ellipse cx="0" cy="-25" rx="8" ry="25" fill="#ffd700" transform="rotate(330)" />
                    <circle cx="0" cy="0" r="18" fill="#5c3a21" />
                    <circle cx="0" cy="0" r="14" fill="#3e2311" stroke="#2a1506" stroke-width="2" stroke-dasharray="2,2"/>
                </g>
            </svg>
            
            <svg class="plant" style="left: 75%; width: 100px; height: 220px; --speed: 3.5s; animation-delay: 0.8s;" viewBox="0 0 100 250">
                <path d="M50,250 Q55,150 50,50" stroke="#32cd32" stroke-width="5" fill="none"/>
                <path d="M48,150 Q15,140 20,110 Q35,130 48,150" fill="#32cd32"/>
                <g transform="translate(50, 50)">
                    <ellipse cx="0" cy="-20" rx="7" ry="22" fill="#ffcc00" transform="rotate(0)" />
                    <ellipse cx="0" cy="-20" rx="7" ry="22" fill="#ffcc00" transform="rotate(45)" />
                    <ellipse cx="0" cy="-20" rx="7" ry="22" fill="#ffcc00" transform="rotate(90)" />
                    <ellipse cx="0" cy="-20" rx="7" ry="22" fill="#ffcc00" transform="rotate(135)" />
                    <ellipse cx="0" cy="-20" rx="7" ry="22" fill="#ffcc00" transform="rotate(180)" />
                    <ellipse cx="0" cy="-20" rx="7" ry="22" fill="#ffcc00" transform="rotate(225)" />
                    <ellipse cx="0" cy="-20" rx="7" ry="22" fill="#ffcc00" transform="rotate(270)" />
                    <ellipse cx="0" cy="-20" rx="7" ry="22" fill="#ffcc00" transform="rotate(315)" />
                    <circle cx="0" cy="0" r="15" fill="#4a2e1b" />
                </g>
            </svg>

            <svg class="plant" style="left: 45%; width: 70px; height: 180px; --speed: 4.5s; animation-delay: 1s;" viewBox="0 0 100 200">
                <path d="M50,200 Q40,120 50,40" stroke="#00fa9a" stroke-width="4" fill="none"/>
                <path d="M49,120 Q30,110 35,90 Q45,100 49,120" fill="#00fa9a"/>
                <g transform="translate(50, 40)">
                    <path d="M0,0 C-20,-20 -20,-40 0,-40 C20,-40 20,-20 0,0" fill="#ffb6c1"/>
                    <path d="M-5,-5 C-30,0 -30,-20 0,-20" fill="#ff69b4"/>
                    <path d="M5,-5 C30,0 30,-20 0,-20" fill="#ff69b4"/>
                </g>
            </svg>
            <svg class="plant" style="left: 60%; width: 60px; height: 150px; --speed: 3.8s; animation-delay: 1.2s;" viewBox="0 0 100 200">
                <path d="M50,200 Q60,120 50,40" stroke="#3cb371" stroke-width="3" fill="none"/>
                <g transform="translate(50, 40)">
                    <circle cx="-10" cy="-10" r="15" fill="#ffffff"/>
                    <circle cx="10" cy="-10" r="15" fill="#ffffff"/>
                    <circle cx="0" cy="5" r="15" fill="#ffffff"/>
                    <circle cx="0" cy="-5" r="8" fill="#ffd700"/>
                </g>
            </svg>
        </div>
    </div>

    <div id="phase3" class="phase" style="display: none;">
        <div class="question-text">¿Te gustó? 🥺</div>
        <div class="buttons-container" id="btns-container">
            <button id="btn-yes" class="btn-answer">Sí</button>
            <button id="btn-no" class="btn-answer" style="left: 170px;">No</button>
        </div>
        
        <svg id="final-heart" viewBox="0 0 200 200">
            <path d="M 100, 170 C 100, 170 15, 100 15, 50 C 15, 20 50, 10 75, 30 C 100, 55 100, 55 100, 55 C 100, 55 100, 55 125, 30 C 150, 10 185, 20 185, 50 C 185, 100 100, 170 100, 170 Z" />
        </svg>
    </div>

    <script>
        // ==== GESTIÓN DE TRANSICIONES ENTRE FASES ====
        // Esta función garantiza que una fase desaparezca por completo antes de mostrar la otra
        function cambiarFase(faseOcultar, faseMostrar, callback) {
            faseOcultar.style.opacity = 0; // Se desvanece
            
            setTimeout(() => {
                faseOcultar.style.display = 'none'; // Desaparece del código visualmente
                
                faseMostrar.style.display = 'flex'; // Aparece la nueva en el flujo
                // Pequeño truco para que la animación de opacidad se aplique correctamente
                void faseMostrar.offsetWidth; 
                
                faseMostrar.style.opacity = 1; // Se hace visible
                
                if(callback) callback(); // Ejecuta la lógica de la nueva fase
            }, 800); // 800ms es lo que dura el fade
        }

        const phase1 = document.getElementById('phase1');
        const phase2 = document.getElementById('phase2');
        const phase3 = document.getElementById('phase3');
        
        // ==== FASE 1 ====
        const btnEntrar = document.getElementById('btn-entrar');
        const letters = document.querySelectorAll('#title-angel span');

        btnEntrar.addEventListener('click', () => {
            btnEntrar.style.pointerEvents = 'none'; 
            
            // Animación letra por letra
            letters.forEach((letter, index) => {
                setTimeout(() => {
                    letter.style.color = '#ffffff';
                    letter.style.textShadow = '0 0 20px #ffffff, 0 0 40px rgba(255, 255, 255, 0.8)';
                }, index * 300);
            });

            // Transición a la fase 2 tras acabar las letras
            setTimeout(() => {
                cambiarFase(phase1, phase2, iniciarFase2);
            }, letters.length * 300 + 800);
        });

        // ==== FASE 2 ====
        let isPhase2Active = false;
        
        function iniciarFase2() {
            isPhase2Active = true;
            
            // Iniciar plantas
            const plants = document.querySelectorAll('.plant');
            plants.forEach(plant => {
                plant.classList.add('grow');
                setTimeout(() => { plant.classList.add('sway'); }, 1500);
            });
            
            // Iniciar cohetes
            loopFuegosArtificiales();

            // TEMPORIZADOR EXACTO DE 7 SEGUNDOS PARA PASAR A FASE 3
            setTimeout(() => {
                isPhase2Active = false; // Detiene los cohetes
                cambiarFase(phase2, phase3);
            }, 7000); // 7000 milisegundos = 7 segundos
        }

        // ==== FASE 3 ====
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const btnsContainer = document.getElementById('btns-container');
        const questionText = document.querySelector('.question-text');
        const finalHeart = document.getElementById('final-heart');

        function moverBotonNo() {
            const maxX = window.innerWidth - btnNo.offsetWidth - 20;
            const maxY = window.innerHeight - btnNo.offsetHeight - 20;
            const randomX = Math.max(20, Math.random() * maxX);
            const randomY = Math.max(20, Math.random() * maxY);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        btnNo.addEventListener('mouseover', moverBotonNo);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moverBotonNo();
        });

        btnYes.addEventListener('click', () => {
            questionText.style.display = 'none';
            btnsContainer.style.display = 'none';
            
            finalHeart.classList.add('explode-heart');
            
            setTimeout(() => {
                window.location.reload(); // Refresh
            }, 1500);
        });

        // ==== LÓGICA DE FUEGOS ARTIFICIALES (CANVAS) ====
        const canvas = document.getElementById('canvas-fireworks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        let particles = [];
        let fireworks = [];

        function randomColor() {
            const colors = ['#ff4d4d', '#4dff4d', '#4da6ff', '#ffff4d', '#ff4da6'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * (canvas.height / 2) + 50;
                this.speed = Math.random() * 3 + 4;
                this.color = randomColor();
                this.radius = 2;
                this.exploded = false;
            }
            update() {
                this.y -= this.speed;
                if (this.y <= this.targetY) {
                    this.exploded = true;
                    this.explode();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            explode() {
                for (let i = 0; i < 40; i++) {
                    particles.push(new Particle(this.x, this.y, this.color));
                }
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function loopFuegosArtificiales() {
            if (!isPhase2Active) {
                ctx.clearRect(0, 0, canvas.width, canvas.height); // Limpia el cielo si ya no estamos en fase 2
                return;
            }

            requestAnimationFrame(loopFuegosArtificiales);
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (Math.random() < 0.03) {
                fireworks.push(new Firework());
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if (fireworks[i].exploded) fireworks.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }
        }
    </script>
</body>
</html>
