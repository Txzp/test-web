<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>xFuxk Obfuscator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#0a0a0a;color:#e8e8e8;
    font-family:'Consolas','Monaco',monospace;
    min-height:100vh;padding:20px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  h1{
    font-size:22px;margin-bottom:4px;
    background:linear-gradient(90deg,#00ff9d,#00d4ff);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .sub{color:#666;font-size:12px;margin-bottom:24px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.row{grid-template-columns:1fr}}
  .box{
    background:#111;border:1px solid #222;border-radius:8px;
    padding:14px;display:flex;flex-direction:column;
  }
  label{font-size:12px;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
  textarea{
    background:#050505;color:#c9f7d8;border:1px solid #1a1a1a;
    border-radius:6px;padding:12px;font-family:inherit;font-size:13px;
    resize:vertical;min-height:340px;outline:none;width:100%;
  }
  textarea:focus{border-color:#00ff9d}
  textarea.out{color:#88ccff;background:#050810}
  .btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{
    background:#00ff9d;color:#000;border:0;padding:10px 18px;
    border-radius:6px;cursor:pointer;font-weight:700;font-size:13px;
    transition:all .15s;
  }
  button:hover{background:#00d887;transform:translateY(-1px)}
  button.sec{background:#222;color:#e8e8e8}
  button.sec:hover{background:#333}
  .opts{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;font-size:12px}
  .opts label{display:flex;align-items:center;gap:6px;color:#aaa;cursor:pointer;text-transform:none;letter-spacing:0}
  .opts input[type=checkbox]{accent-color:#00ff9d}
  .status{
    margin-top:12px;padding:8px 12px;border-radius:6px;font-size:12px;
    background:#111;border:1px solid #222;color:#888;min-height:28px;
  }
  .status.ok{color:#00ff9d;border-color:#00ff9d33}
  .status.err{color:#ff5566;border-color:#ff556633}
  code{background:#000;padding:2px 6px;border-radius:3px;color:#ffcc00}
</style>
</head>
<body>
<div class="wrap">
  <h1>xFuxk Obfuscator</h1>
  <div class="sub">Pega tu código Lua → obtén un loadstring ofuscado (XOR + Base64). 100% cliente-side.</div>

  <div class="opts">
    <label><input type="checkbox" id="opt-junk" checked> Insertar código basura</label>
    <label><input type="checkbox" id="opt-split" checked> Dividir el string en chunks</label>
    <label><input type="checkbox" id="opt-alias" checked> Renombrar variables</label>
  </div>

  <div class="row">
    <div class="box">
      <label>Código Lua original</label>
      <textarea id="src" placeholder="print('hello world')"></textarea>
    </div>
    <div class="box">
      <label>Salida (loadstring ofuscado)</label>
      <textarea id="out" class="out" placeholder="El resultado aparecerá aquí..." readonly></textarea>
    </div>
  </div>

  <div class="btns">
    <button onclick="doObf()">🔒 Obfuscate</button>
    <button class="sec" onclick="copyOut()">📋 Copiar resultado</button>
    <button class="sec" onclick="document.getElementById('src').value='';document.getElementById('out').value='';setStatus('')">🧹 Limpiar</button>
  </div>

  <div class="status" id="status">Listo.</div>
</div>

<script>
const $ = id => document.getElementById(id);
const setStatus = (m, cls='') => {
  const s = $('status'); s.textContent = m; s.className = 'status ' + cls;
};

function randKey(n=24){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let k=''; for(let i=0;i<n;i++) k+=chars[Math.floor(Math.random()*chars.length)];
  return k;
}

function b64enc(str){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  let out='', i=0;
  while(i<str.length){
    const a=str.charCodeAt(i++), b=str.charCodeAt(i++), c=str.charCodeAt(i++);
    const triple = ((a<<16)|(b<<8)|c) >>> 0;
    out += chars[(triple>>18)&63] + chars[(triple>>12)&63];
    if(i-2 < str.length) out += chars[(triple>>6)&63]; else { out += '='; break; }
    if(i-1 < str.length) out += chars[triple&63]; else { out += '='; break; }
  }
  return out;
}

function xorEncode(str, key){
  const bytes=[];
  for(let i=0;i<str.length;i++){
    const kb = key.charCodeAt(i % key.length);
    bytes.push(str.charCodeAt(i) ^ kb);
  }
  // Convertimos bytes a string raw
  return String.fromCharCode.apply(null, bytes);
}

function randName(n){
  const first='abcdefghijklmnopqrstuvwxyz';
  const rest='abcdefghijklmnopqrstuvwxyz0123456789_';
  let s=first[Math.floor(Math.random()*first.length)];
  for(let i=1;i<n;i++) s+=rest[Math.floor(Math.random()*rest.length)];
  return s;
}

function splitChunks(s, size=800){
  if(s.length<=size) return [s];
  const chunks=[];
  for(let i=0;i<s.length;i+=size) chunks.push(s.substr(i,size));
  return chunks;
}

function luaEscape(s){
  return s.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'');
}

function genJunk(){
  // Genera variables basura que no afectan ejecución
  const lines=[];
  const n=3+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    lines.push(`local ${randName(8)} = ${Math.floor(Math.random()*999999)}`);
  }
  return lines.join('\n');
}

function doObf(){
  const src = $('src').value;
  if(!src.trim()){ setStatus('Pega código primero.', 'err'); return; }

  try{
    const optJunk = $('opt-junk').checked;
    const optSplit = $('opt-split').checked;
    const optAlias = $('opt-alias').checked;

    const key = randKey(24);
    const xored = xorEncode(src, key);
    const b64 = b64enc(xored);

    // Nombres
    const fnD   = optAlias ? randName(7) : 'd';
    const fnB   = optAlias ? randName(7) : 'decode';
    const vB64  = optAlias ? randName(7) : 'b64';
    const vData = optAlias ? randName(7) : 'data';
    const vOut  = optAlias ? randName(7) : 'out';
    const vKey  = optAlias ? randName(7) : 'k';
    const vS    = optAlias ? randName(7) : 's';

    // Construir string ofuscado (con o sin split)
    let dataLiteral;
    if(optSplit){
      const chunks = splitChunks(b64, 800);
      dataLiteral = chunks.map(c => `"${luaEscape(c)}"`).join('..');
    } else {
      dataLiteral = `"${luaEscape(b64)}"`;
    }

    // Rutina de desobfuscación en Lua
    let routine = `local ${vB64}="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"\n`;
    routine += `local function ${fnB}(${vS})\n`;
    routine += `  ${vS}=${vS}:gsub("=","")\n`;
    routine += `  local ${vOut}=""\n`;
    routine += `  for ${randName(3)}=1,#${vS},4 do\n`;
    routine += `    local a,b,c,dd=${vB64}:find(${vS}:sub(${randName(3)},${randName(3)})),${vB64}:find(${vS}:sub(${randName(3)}+1,${randName(3)}+1)),${vB64}:find(${vS}:sub(${randName(3)}+2,${randName(3)}+2)),${vB64}:find(${vS}:sub(${randName(3)}+3,${randName(3)}+3))\n`;
    routine += `    if a and b then\n`;
    routine += `      ${vOut}=${vOut}..string.char(((a-1)*4)+math.floor((b-1)/16))\n`;
    routine += `      if c then ${vOut}=${vOut}..string.char(((b-1)%16)*16+math.floor((c-1)/4)) end\n`;
    routine += `      if dd then ${vOut}=${vOut}..string.char(((c-1)%4)*64+(dd-1)) end\n`;
    routine += `    end\n`;
    routine += `  end\n`;
    routine += `  return ${vOut}\n`;
    routine += `end\n`;
    routine += `local function ${fnD}(${vS},${vKey})\n`;
    routine += `  local ${vData}=${fnB}(${vS})\n`;
    routine += `  local ${vOut}={}\n`;
    routine += `  for ${randName(3)}=1,#${vData} do\n`;
    routine += `    local byte=string.byte(${vData},${randName(3)})\n`;
    routine += `    local kb=string.byte(${vKey},((${randName(3)}-1)%#${vKey})+1)\n`;
    routine += `    local r,p,c=0,1,0\n`;
    routine += `    local aa,bb=byte,kb\n`;
    routine += `    while aa>0 and bb>0 do\n`;
    routine += `      local ra,rb=aa%2,bb%2\n`;
    routine += `      if ra~=rb then c=c+p end\n`;
    routine += `      aa,bb,p=(aa-ra)/2,(bb-rb)/2,p*2\n`;
    routine += `    end\n`;
    routine += `    if aa<bb then aa=bb end\n`;
    routine += `    while aa>0 do\n`;
    routine += `      local ra=aa%2\n`;
    routine += `      if ra>0 then c=c+p end\n`;
    routine += `      aa,p=(aa-ra)/2,p*2\n`;
    routine += `    end\n`;
    routine += `    ${vOut}[${randName(3)}]=string.char(c)\n`;
    routine += `  end\n`;
    routine += `  return table.concat(${vOut})\n`;
    routine += `end\n`;

    const keyLiteral = `"${luaEscape(key)}"`;

    let output = '';
    if(optJunk) output += genJunk() + '\n';
    output += routine;
    output += `loadstring(${fnD}(${dataLiteral},${keyLiteral}))()`;

    $('out').value = output;
    setStatus(`✅ Ofuscado (${output.length} chars). Key: ${key}`, 'ok');
  }catch(e){
    setStatus('Error: ' + e.message, 'err');
  }
}

function copyOut(){
  const t = $('out');
  if(!t.value){ setStatus('Nada que copiar.', 'err'); return; }
  t.select();
  document.execCommand('copy');
  window.getSelection().removeAllRanges();
  setStatus('📋 Copiado al portapapeles.', 'ok');
}
</script>
</body>
</html>
